# 日均 1,000-2,000 单推荐集群拓扑：
# Nginx 负载均衡 + 2 个无状态应用节点 + MySQL 8 + Redis 7
#
# 启动前请先在同级目录准备 .env 或导出环境变量：
#   ADMIN_PASSWORD / MYSQL_PASSWORD / MYSQL_ROOT_PASSWORD / S3_* / STRIPE_*
# 启动命令：
#   docker compose -f docker-compose.cluster.yml up -d --build
#
# 商品图片：默认 STORAGE_TYPE=local，两个节点共用同一个 uploads-data 卷（只适用于两个节点在同一台机器上）；
# 节点分布在多台服务器上时，请改用 STORAGE_TYPE=s3 对接对象存储。
# Redis 密码：设置 REDIS_PASSWORD 后 Redis 服务端和应用同时启用该密码；不设置时 Redis 无密码，仅在 Docker 内部网络可访问。

x-shop-env: &shop-env
  SPRING_PROFILES_ACTIVE: prod
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在环境变量中设置强密码 ADMIN_PASSWORD}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
  DB_URL: jdbc:mysql://mysql:3306/shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  DB_USERNAME: shop
  DB_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  REDIS_ENABLED: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  UPLOAD_DIR: /app/uploads
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  MAIL_CONCURRENCY: ${MAIL_CONCURRENCY:-4}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      shop-1:
        condition: service_healthy
      shop-2:
        condition: service_healthy

  shop-1:
    build: .
    restart: unless-stopped
    environment: *shop-env
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  shop-2:
    build: .
    restart: unless-stopped
    environment: *shop-env
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u shop -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # 设置了 REDIS_PASSWORD 时才加 --requirepass（$$ 让变量留给容器里的 shell 展开）
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\" --no-auth-warning} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  uploads-data:
