# 日均 1,000-2,000 单推荐集群拓扑：
# Nginx（HTTPS）负载均衡 + 2 个无状态应用节点 + MySQL 8 + Redis 7
#
# 首次部署（详见 docs/deploy-cluster.md）：
#   1. ./deploy/init-secrets.sh            生成 secrets/ 下的随机密码文件，再按需填入 Stripe / PayPal 等密钥
#   2. 放好 HTTPS 证书：deploy/certs/fullchain.pem 和 privkey.pem
#      （正式域名用 ./deploy/issue-cert.sh 申请 Let's Encrypt 免费证书；本机试运行用 ./deploy/gen-self-signed-cert.sh）
#   3. 在 .env 里设置 PUBLIC_BASE_URL=https://你的域名
#   4. docker compose -f docker-compose.cluster.yml up -d --build
#   5. （推荐）同时启动监控和日志：docker compose -f docker-compose.cluster.yml --profile monitoring up -d
#      先在 deploy/monitoring/alertmanager.yml 里填上接收告警的邮箱，见 docs/operations.md
#
# 密码和密钥不写在环境变量里：都以文件形式挂载到容器的 /run/secrets/，应用启动时读取（见 SECRETS_DIR）。
# 商品图片：默认 STORAGE_TYPE=local，两个节点共用同一个 uploads-data 卷（只适用于两个节点在同一台机器上）；
# 节点分布在多台服务器上时，请改用 STORAGE_TYPE=s3 对接对象存储。

x-shop-env: &shop-env
  SPRING_PROFILES_ACTIVE: prod
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
  DB_URL: jdbc:mysql://mysql:3306/shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
  DB_USERNAME: shop
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  REDIS_ENABLED: "true"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  UPLOAD_DIR: /app/uploads
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
  PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
  PAYPAL_SANDBOX: ${PAYPAL_SANDBOX:-true}
  SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
  SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
  SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
  SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}
  SHOP_MAIL_FROM: ${SHOP_MAIL_FROM:-}
  MAIL_CONCURRENCY: ${MAIL_CONCURRENCY:-4}
  SECRETS_DIR: /run/secrets/
  # 备份服务每次成功后更新这个文件，应用把它的时间作为监控指标
  BACKUP_STATUS_FILE: /backups/.last-success
  # 同一 IP 10 分钟内最多下单次数；只在预发布 / 压测环境调大
  ORDER_PER_IP_LIMIT: ${ORDER_PER_IP_LIMIT:-20}

# 应用读取的密钥文件（文件名即变量名；没用到的功能留空文件即可）
x-shop-secrets: &shop-secrets
  - source: admin_password
    target: ADMIN_PASSWORD
  - source: admin_totp_secret
    target: ADMIN_TOTP_SECRET
  - source: db_password
    target: DB_PASSWORD
  - source: redis_password
    target: REDIS_PASSWORD
  - source: stripe_secret_key
    target: STRIPE_SECRET_KEY
  - source: stripe_webhook_secret
    target: STRIPE_WEBHOOK_SECRET
  - source: paypal_client_secret
    target: PAYPAL_CLIENT_SECRET
  - source: anthropic_api_key
    target: ANTHROPIC_API_KEY
  - source: s3_secret_key
    target: S3_SECRET_KEY
  - source: mail_password
    target: spring.mail.password
  - source: metrics_token
    target: METRICS_TOKEN

x-shop-node: &shop-node
  build: .
  restart: unless-stopped
  environment: *shop-env
  secrets: *shop-secrets
  volumes:
    - uploads-data:/app/uploads
    - ${BACKUP_PATH:-./backups}:/backups:ro
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERTS_PATH:-./deploy/certs}:/etc/nginx/certs:ro
      - ./deploy/certbot-www:/var/www/certbot:ro
    logging: *logging
    depends_on:
      shop-1:
        condition: service_healthy
      shop-2:
        condition: service_healthy

  shop-1: *shop-node
  shop-2: *shop-node

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    environment:
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD_FILE: /run/secrets/DB_PASSWORD
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/MYSQL_ROOT_PASSWORD
    secrets:
      - source: db_password
        target: DB_PASSWORD
      - source: mysql_root_password
        target: MYSQL_ROOT_PASSWORD
    volumes:
      - mysql-data:/var/lib/mysql
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u shop -p\"$$(cat /run/secrets/DB_PASSWORD)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    secrets:
      - source: redis_password
        target: REDIS_PASSWORD
    # 密钥文件非空时才加 --requirepass（$$ 让变量留给容器里的 shell 展开）
    command:
      - sh
      - -c
      - P=$$(cat /run/secrets/REDIS_PASSWORD 2>/dev/null); exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru $${P:+--requirepass "$$P"}
    volumes:
      - redis-data:/data
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "P=$$(cat /run/secrets/REDIS_PASSWORD 2>/dev/null); redis-cli $${P:+-a \"$$P\" --no-auth-warning} ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 每天定时备份数据库和商品图片到 ./backups（时间、保留天数见 docs/operations.md）
  backup:
    build: ./deploy/backup
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      BACKUP_AT: ${BACKUP_AT:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    secrets:
      - source: db_password
        target: DB_PASSWORD
    volumes:
      - uploads-data:/uploads
      - ${BACKUP_PATH:-./backups}:/backups
    logging: *logging
    depends_on:
      mysql:
        condition: service_healthy

  # ===== 监控、告警、日志（--profile monitoring 时启动）=====
  # 只监听本机 127.0.0.1，不对公网开放；在自己电脑上用 SSH 隧道访问，见 docs/operations.md
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    secrets:
      - source: metrics_token
        target: METRICS_TOKEN
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # 只有一个 Alertmanager，关掉多实例之间的集群通信
      - --cluster.listen-address=
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    secrets:
      - source: mail_password
        target: SMTP_PASSWORD
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    logging: *logging

  loki:
    image: grafana/loki:3.2.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    logging: *logging

  # 采集所有容器的日志送进 Loki（需要读取 Docker 的容器信息）
  alloy:
    image: grafana/alloy:v1.4.3
    profiles: ["monitoring"]
    restart: unless-stopped
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./deploy/monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging: *logging
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/GRAFANA_ADMIN_PASSWORD
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    secrets:
      - source: grafana_admin_password
        target: GRAFANA_ADMIN_PASSWORD
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    logging: *logging
    depends_on:
      - prometheus
      - loki

  # 申请 / 续期 Let's Encrypt 证书时临时运行（./deploy/issue-cert.sh），平时不启动
  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["certbot"]
    volumes:
      - ./deploy/certbot-www:/var/www/certbot
      - ./deploy/letsencrypt:/etc/letsencrypt

secrets:
  admin_password:
    file: ${SECRETS_PATH:-./secrets}/ADMIN_PASSWORD
  admin_totp_secret:
    file: ${SECRETS_PATH:-./secrets}/ADMIN_TOTP_SECRET
  db_password:
    file: ${SECRETS_PATH:-./secrets}/DB_PASSWORD
  mysql_root_password:
    file: ${SECRETS_PATH:-./secrets}/MYSQL_ROOT_PASSWORD
  redis_password:
    file: ${SECRETS_PATH:-./secrets}/REDIS_PASSWORD
  stripe_secret_key:
    file: ${SECRETS_PATH:-./secrets}/STRIPE_SECRET_KEY
  stripe_webhook_secret:
    file: ${SECRETS_PATH:-./secrets}/STRIPE_WEBHOOK_SECRET
  paypal_client_secret:
    file: ${SECRETS_PATH:-./secrets}/PAYPAL_CLIENT_SECRET
  anthropic_api_key:
    file: ${SECRETS_PATH:-./secrets}/ANTHROPIC_API_KEY
  s3_secret_key:
    file: ${SECRETS_PATH:-./secrets}/S3_SECRET_KEY
  mail_password:
    file: ${SECRETS_PATH:-./secrets}/SPRING_MAIL_PASSWORD
  metrics_token:
    file: ${SECRETS_PATH:-./secrets}/METRICS_TOKEN
  grafana_admin_password:
    file: ${SECRETS_PATH:-./secrets}/GRAFANA_ADMIN_PASSWORD

volumes:
  mysql-data:
  redis-data:
  uploads-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
