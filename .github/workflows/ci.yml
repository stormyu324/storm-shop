name: CI

on:
  push:
    branches: ["main", "master", "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run Maven test suite
        run: chmod +x mvnw && ./mvnw test -B

      - name: Build JAR package
        run: ./mvnw package -DskipTests -B

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker image build
        run: docker build -t storm-shop:ci .
