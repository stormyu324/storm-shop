# 依赖更新：每周检查，只自动提小版本和补丁更新（CI 通过后合并）。
# 大版本升级（如 Spring Boot 3 → 4、Java 21 → 25）往往要改代码，不自动提，需要时单独评估、单独升级。
# 有安全漏洞时 GitHub 仍会提醒（仓库 Security 页的 Dependabot alerts）。
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: npm
    directory: /admin-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # 基础镜像的 Java 大版本跟着 pom.xml 的 java.version 一起手动升级
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
