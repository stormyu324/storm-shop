upstream storm_shop_backend {
    least_conn;
    server shop-1:8080 max_fails=3 fail_timeout=15s;
    server shop-2:8080 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# HTTP：只用于 Let's Encrypt 验证域名，其余请求一律跳转到 HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书放在 deploy/certs/（见 docs/deploy-cluster.md）
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # 监控指标只给内网的 Prometheus 直接访问应用节点抓取，不对公网开放；健康检查保留
    location /actuator/ {
        return 404;
    }
    location ~ ^/actuator/health(/.*)?$ {
        proxy_pass http://storm_shop_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://storm_shop_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 告诉应用这是 HTTPS 请求：会话 Cookie 带 Secure、发送 HSTS、生成的链接用 https
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
