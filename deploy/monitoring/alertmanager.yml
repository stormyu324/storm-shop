# Alertmanager：把告警发到你的邮箱。启用前请改成你自己的邮箱和 SMTP 服务器（见 docs/operations.md）。
# SMTP 密码复用 secrets/SPRING_MAIL_PASSWORD（和商城发通知邮件用同一个邮箱），不写在这个文件里。
global:
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "shop@example.com"
  smtp_auth_username: "shop@example.com"
  smtp_auth_password_file: /run/secrets/SMTP_PASSWORD
  smtp_require_tls: true

route:
  receiver: owner
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  # 没解决的告警每 4 小时再提醒一次；critical 每小时一次
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: owner
      repeat_interval: 1h

receivers:
  - name: owner
    email_configs:
      - to: "owner@example.com"
        send_resolved: true
    # 也可以同时推送到企业微信 / 钉钉 / 飞书 / Slack 等（它们都支持 Webhook，需按各自文档配置机器人）：
    # webhook_configs:
    #   - url: "https://example.com/your-webhook"

inhibit_rules:
  # 所有节点都挂了时，不再重复发“单个节点挂了”
  - source_matchers: ['alertname="ShopAllNodesDown"']
    target_matchers: ['alertname="ShopNodeDown"']
