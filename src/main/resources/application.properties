spring.application.name=storm-shop
server.port=${PORT:8080}
# 部署在 Nginx 等反向代理后面时，从 X-Forwarded-For 取顾客的真实 IP，限流按每位顾客分别计算。
# 只信任本机和内网地址发来的这个头（反向代理通常在这里），顾客直接访问时无法伪造；
# 代理在公网上（如 CDN）时，用 server.tomcat.remoteip.trusted-proxies 加上代理的地址，见 README
server.forward-headers-strategy=native

# 数据库：默认使用本地文件型 H2（./data/shop.mv.db），无需安装数据库即可运行。
# 换成 MySQL：设置 DB_URL=jdbc:mysql://主机:3306/库名 和账号密码，见 README“换成 MySQL”。
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/shop;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
# 表结构由 Flyway 版本化管理；Hibernate 仅校验实体与表结构一致，禁止自动改表
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
# 列表页批量加载商品图片/分类，避免每个商品单独查一次（N+1）
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# 商品图片上传（默认 local 保存到本地目录；集群生产环境设为 s3 对接 AWS S3 / Cloudflare R2 / 阿里云 OSS / MinIO）
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
shop.upload-dir=${UPLOAD_DIR:./uploads}
shop.storage.type=${STORAGE_TYPE:local}
shop.storage.s3.endpoint=${S3_ENDPOINT:}
shop.storage.s3.region=${S3_REGION:auto}
shop.storage.s3.bucket=${S3_BUCKET:}
shop.storage.s3.access-key=${S3_ACCESS_KEY:}
shop.storage.s3.secret-key=${S3_SECRET_KEY:}
shop.storage.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
shop.storage.s3.path-style-access=${S3_PATH_STYLE:true}
shop.storage.s3.key-prefix=${S3_KEY_PREFIX:storm-shop}

# 后台管理员账号（上线前务必通过环境变量修改密码；可选配置 ADMIN_TOTP_SECRET 开启双因素认证）
shop.admin.username=${ADMIN_USERNAME:admin}
shop.admin.password=${ADMIN_PASSWORD:admin123}
shop.admin.totp-secret=${ADMIN_TOTP_SECRET:}

# 空数据库首次启动时写入示例商品
shop.demo-data=${DEMO_DATA:true}

spring.thymeleaf.cache=false

# 多语言：中文为默认，英文前台按美元结算
spring.messages.basename=messages
spring.messages.fallback-to-system-locale=false
# 美元价格未填写时使用的汇率（1 美元 = 多少人民币）
shop.cny-per-usd=${CNY_PER_USD:7.10}
# 网站对外访问地址，导出到亚马逊/SHEIN 的图片链接会用它拼成完整网址，例如 https://www.myshop.com
shop.public-base-url=${PUBLIC_BASE_URL:}

# AI 生成英文资料（Claude）：设置环境变量 ANTHROPIC_API_KEY 后启用
shop.ai.api-key=${ANTHROPIC_API_KEY:}
shop.ai.model=${AI_MODEL:claude-opus-5-5}

# Stripe 在线支付：设置 STRIPE_SECRET_KEY 后启用，默认只对美元订单（英文前台）启用
shop.stripe.secret-key=${STRIPE_SECRET_KEY:}
shop.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
shop.stripe.currencies=${STRIPE_CURRENCIES:USD}

# PayPal Orders v2 在线支付：设置 PAYPAL_CLIENT_ID 和 PAYPAL_CLIENT_SECRET 后启用
shop.paypal.client-id=${PAYPAL_CLIENT_ID:}
shop.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
shop.paypal.sandbox=${PAYPAL_SANDBOX:true}
shop.paypal.currencies=${PAYPAL_CURRENCIES:USD}
shop.paypal.api-base=${PAYPAL_API_BASE:}

# 接口文档：/swagger-ui.html（只包含 /api/** 接口）
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
# Swagger UI 调试后台接口时，自动从 Cookie XSRF-TOKEN 读取 CSRF 令牌放进请求头
springdoc.swagger-ui.csrf.enabled=true

# AI 导购（推荐商品）：和英文资料生成共用 ANTHROPIC_API_KEY
shop.ai.recommend.enabled=${AI_RECOMMEND:true}
shop.ai.recommend.per-client=${AI_RECOMMEND_PER_CLIENT:10}
shop.ai.recommend.daily-limit=${AI_RECOMMEND_DAILY_LIMIT:300}

# 线下收款的订单下单时就扣库存；超过这么多小时仍未在后台确认收款，自动取消并退回库存。0 表示不自动取消
shop.offline-orders.cancel-after-hours=${OFFLINE_ORDER_CANCEL_HOURS:72}

# 邮件发件箱并发消费线程数与轮询间隔（毫秒）
shop.mail.concurrency=${MAIL_CONCURRENCY:4}
shop.mail.poll-delay-ms=${MAIL_POLL_DELAY_MS:10000}

# 优雅停机与连接池调优（支撑滚动发布与高并发）
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=10000

# 可观测性：仅暴露健康探针与 Prometheus 指标（/actuator/prometheus 需要 ADMIN 权限）
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.redis.enabled=${REDIS_ENABLED:false}
management.health.mail.enabled=false
management.metrics.tags.application=${spring.application.name}

# Redis 分布式无状态配置（多实例集群部署时仅需设置 REDIS_ENABLED=true，自动开启 Spring Session + Redis 限流/幂等/防爆破）
shop.redis.enabled=${REDIS_ENABLED:false}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
spring.data.redis.repositories.enabled=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:3s}

# ===== 安全 =====
# 内容安全策略，留空用代码里的默认值（只允许本站脚本），需要接入第三方脚本时再覆盖
shop.security.csp=${SECURITY_CSP:}
# 会话 Cookie：JavaScript 读不到，跨站请求默认不带
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 密钥可以放在文件里而不是环境变量：目录下每个文件名是变量名、内容是值（如 /run/secrets/ADMIN_PASSWORD），
# 和 Docker / Kubernetes secrets 的挂载方式一致；目录不存在时忽略
spring.config.import=optional:configtree:${SECRETS_DIR:/run/secrets/}

# ===== 监控 =====
# Prometheus 抓取 /actuator/prometheus 用的令牌（请求头 Authorization: Bearer <令牌>），留空时只有管理员登录后能看
shop.metrics.token=${METRICS_TOKEN:}
# 备份脚本每次成功后更新这个文件，指标 shop_backup_last_success_age_seconds 据此告警“备份太久没成功”
shop.backup.status-file=${BACKUP_STATUS_FILE:}
# 请求耗时按区间统计，Prometheus 才能算出 95 分位响应时间
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=200ms,500ms,1s,2s,5s

# 同一 IP 10 分钟内最多下单次数（防止脚本批量下单占库存）。只在压测环境调大，正式环境保持默认
shop.orders.per-ip-limit=${ORDER_PER_IP_LIMIT:20}
