<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{site.name}">Storm 商城</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="container narrow">
    <div class="card center">
        <h1 th:text="${status == 404} ? #{error.notFound.title} : #{error.general.title}">出错了</h1>
        <p th:text="${status == 404} ? #{error.notFound.text} : #{error.general.text}"></p>
        <p><a th:href="@{/}" class="btn" th:text="#{error.home}">回到首页</a></p>
    </div>
</main>
</body>
</html>
