<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${form.id == null} ? '添加商品' : '编辑商品')}"></head>
<body>
<header th:replace="~{fragments/layout :: adminHeader('products')}"></header>
<main class="container" style="max-width:900px">
    <p><a th:href="@{/admin/products}">← 返回商品列表</a></p>
    <h1 th:text="${form.id == null} ? '添加商品' : '编辑商品'">添加商品</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <form th:action="@{/admin/products/save}" th:object="${form}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">
        <input type="hidden" th:field="*{version}">

        <div class="card">
            <h2>基本信息</h2>
            <div class="field">
                <label for="name">商品名称 *</label>
                <input id="name" th:field="*{name}" required maxlength="200" placeholder="例如：纯棉圆领T恤 白色 M码">
                <div class="err" th:errors="*{name}"></div>
            </div>
            <div class="grid-2">
                <div class="field">
                    <label for="categoryId">分类</label>
                    <select id="categoryId" th:field="*{categoryId}">
                        <option value="">未分类</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                    <div class="hint">没有合适的分类？<a th:href="@{/admin/categories}" target="_blank">去添加</a></div>
                </div>
                <div class="field">
                    <label for="sku">SKU / 商品编码</label>
                    <input id="sku" th:field="*{sku}" maxlength="64" placeholder="留空自动生成">
                    <div class="err" th:errors="*{sku}"></div>
                </div>
            </div>
            <div class="grid-3">
                <div class="field">
                    <label for="price">售价（元）*</label>
                    <input id="price" th:field="*{price}" type="number" step="0.01" min="0" required>
                    <div class="err" th:errors="*{price}"></div>
                </div>
                <div class="field">
                    <label for="originalPrice">原价（元）</label>
                    <input id="originalPrice" th:field="*{originalPrice}" type="number" step="0.01" min="0" placeholder="可选，显示为划线价">
                    <div class="err" th:errors="*{originalPrice}"></div>
                </div>
                <div class="field">
                    <label for="stock">库存 *</label>
                    <input id="stock" th:field="*{stock}" type="number" min="0" required>
                    <div class="err" th:errors="*{stock}"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>商品图片</h2>
            <label class="dropzone" id="dropzone">
                <input type="file" id="images" name="images" accept="image/*" multiple>
                <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg></div>
                <strong>点击选择图片，或把图片拖到这里</strong>
                <div class="muted">可一次选多张，支持 jpg / png / gif / webp，单张不超过 10MB</div>
            </label>
            <div class="previews" id="newPreviews"></div>

            <div class="field" style="margin-top:16px">
                <label for="imageUrlsText">图片地址（每行一个，第一张为主图）</label>
                <textarea id="imageUrlsText" th:field="*{imageUrlsText}" rows="3" placeholder="也可以直接粘贴网络图片地址，例如 https://example.com/a.jpg"></textarea>
                <div class="hint">已上传的图片也列在这里：调整行的顺序可以更换主图，删掉某一行即可移除该图片。新上传的图片会排在最后。</div>
            </div>
            <div class="previews" id="urlPreviews"></div>
        </div>

        <div class="card">
            <h2>商品描述</h2>
            <textarea th:field="*{description}" rows="8" maxlength="10000" placeholder="材质、尺寸、规格、使用说明等"></textarea>
            <div class="err" th:errors="*{description}"></div>
        </div>

        <details class="card section" th:open="${form.titleEn != null or form.brand != null or form.barcode != null or form.priceUsd != null}">
            <summary><span style="width:4px;height:16px;border-radius:2px;background:var(--grad);display:inline-block"></span>跨境 / 平台资料 <span class="muted" style="font-weight:400;font-size:.85rem">英文前台、导出亚马逊 / SHEIN 时使用，可选填</span></summary>
            <div class="ai-bar">
                <button type="button" id="aiGenerate" class="ghost small" th:disabled="${!aiEnabled}">✨ AI 生成英文标题、卖点和描述</button>
                <span id="aiStatus" class="muted" th:text="${aiEnabled} ? '根据上面填写的中文名称、描述、品牌、颜色、尺码、材质等生成，生成后可以再修改' : '需要先设置环境变量 ANTHROPIC_API_KEY 才能使用'"></span>
            </div>
            <div class="grid-2">
                <div class="field">
                    <label for="titleEn">英文标题</label>
                    <input id="titleEn" th:field="*{titleEn}" maxlength="200" placeholder="e.g. Classic Cotton Crew Neck T-Shirt">
                    <div class="err" th:errors="*{titleEn}"></div>
                </div>
                <div class="field">
                    <label for="priceUsd">美元售价（USD）</label>
                    <input id="priceUsd" th:field="*{priceUsd}" type="number" step="0.01" min="0" placeholder="留空则按汇率自动换算">
                    <div class="err" th:errors="*{priceUsd}"></div>
                </div>
            </div>
            <div class="grid-3">
                <div class="field">
                    <label for="brand">品牌</label>
                    <input id="brand" th:field="*{brand}" maxlength="100">
                    <div class="hint">亚马逊上架必填（无品牌可填 Generic，以平台要求为准）</div>
                </div>
                <div class="field">
                    <label for="parentSku">款号（父 SKU）</label>
                    <input id="parentSku" th:field="*{parentSku}" maxlength="64" placeholder="同款不同颜色/尺码填同一个">
                    <div class="err" th:errors="*{parentSku}"></div>
                </div>
                <div class="field">
                    <label for="barcode">条码 UPC / EAN</label>
                    <input id="barcode" th:field="*{barcode}" maxlength="14" inputmode="numeric" placeholder="12~14 位数字">
                    <div class="err" th:errors="*{barcode}"></div>
                </div>
            </div>
            <div class="grid-3">
                <div class="field">
                    <label for="color">颜色</label>
                    <input id="color" th:field="*{color}" maxlength="50" placeholder="e.g. White">
                </div>
                <div class="field">
                    <label for="size">尺码</label>
                    <input id="size" th:field="*{size}" maxlength="50" placeholder="e.g. M">
                </div>
                <div class="field">
                    <label for="material">材质</label>
                    <input id="material" th:field="*{material}" maxlength="100" placeholder="e.g. 100% Cotton">
                </div>
            </div>
            <div class="grid-2">
                <div class="field">
                    <label for="weightGrams">重量（克）</label>
                    <input id="weightGrams" th:field="*{weightGrams}" type="number" min="0">
                    <div class="err" th:errors="*{weightGrams}"></div>
                </div>
                <div class="field">
                    <label>包装尺寸 长 × 宽 × 高（厘米）</label>
                    <div class="actions" style="flex-wrap:nowrap">
                        <input th:field="*{lengthCm}" type="number" step="0.1" min="0" placeholder="长" style="min-width:0">
                        <input th:field="*{widthCm}" type="number" step="0.1" min="0" placeholder="宽" style="min-width:0">
                        <input th:field="*{heightCm}" type="number" step="0.1" min="0" placeholder="高" style="min-width:0">
                    </div>
                </div>
            </div>
            <div class="field">
                <label for="bulletPointsEn">英文卖点（每行一条，最多 5 条）</label>
                <textarea id="bulletPointsEn" th:field="*{bulletPointsEn}" rows="5" maxlength="2500" placeholder="SOFT &amp; BREATHABLE: 100% cotton keeps you cool all day&#10;CLASSIC FIT: ..."></textarea>
                <div class="err" th:errors="*{bulletPointsEn}"></div>
            </div>
            <div class="field">
                <label for="descriptionEn">英文描述</label>
                <textarea id="descriptionEn" th:field="*{descriptionEn}" rows="5" maxlength="10000"></textarea>
                <div class="err" th:errors="*{descriptionEn}"></div>
            </div>
        </details>

        <div class="card">
            <div class="field">
                <label>保存后的状态</label>
                <label th:each="s : ${statuses}" style="display:inline-block;font-weight:400;margin-right:18px">
                    <input type="radio" th:field="*{status}" th:value="${s}"> <span th:text="${s.label}"></span>
                </label>
                <div class="hint">“上架”后顾客立刻就能在商城看到并购买；“草稿”仅保存，不展示。</div>
            </div>
            <div class="actions">
                <button type="submit">保存</button>
                <button type="submit" name="next" value="new" class="ghost" th:if="${form.id == null}">保存并继续添加</button>
                <a th:href="@{/admin/products}" class="btn ghost">取消</a>
            </div>
        </div>
    </form>
</main>
<script>
    (function () {
        var btn = document.getElementById('aiGenerate');
        if (!btn) return;
        var statusEl = document.getElementById('aiStatus');
        var form = btn.form;
        function val(name) {
            var el = form.elements[name];
            return el && el.value.trim() ? el.value.trim() : null;
        }
        btn.addEventListener('click', function () {
            var targets = ['titleEn', 'bulletPointsEn', 'descriptionEn'];
            var hasContent = targets.some(function (n) { return val(n); });
            if (hasContent && !confirm('会覆盖已填写的英文标题、卖点和描述，确定吗？')) return;
            var payload = {
                name: val('name'), categoryId: val('categoryId'), description: val('description'),
                brand: val('brand'), color: val('color'), size: val('size'), material: val('material'),
                weightGrams: val('weightGrams'), lengthCm: val('lengthCm'), widthCm: val('widthCm'),
                heightCm: val('heightCm'), titleEn: val('titleEn')
            };
            btn.disabled = true;
            statusEl.textContent = '正在生成，通常需要 10～30 秒…';
            fetch('/admin/products/ai/english', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'X-CSRF-TOKEN': form.elements['_csrf'].value},
                body: JSON.stringify(payload)
            }).then(function (res) {
                return res.json().catch(function () { return {error: '服务器返回异常（' + res.status + '）'}; });
            }).then(function (data) {
                if (data.error) {
                    statusEl.textContent = data.error;
                    return;
                }
                targets.forEach(function (n) { form.elements[n].value = data[n] || ''; });
                statusEl.textContent = '已生成，请检查后再保存（AI 可能出错，尤其是尺寸、材质等事实信息）';
            }).catch(function () {
                statusEl.textContent = '网络错误，请重试';
            }).finally(function () {
                btn.disabled = false;
            });
        });
    })();

    (function () {
        var input = document.getElementById('images');
        var zone = document.getElementById('dropzone');
        var newPreviews = document.getElementById('newPreviews');
        var urls = document.getElementById('imageUrlsText');
        var urlPreviews = document.getElementById('urlPreviews');

        function showFiles() {
            newPreviews.innerHTML = '';
            Array.prototype.forEach.call(input.files, function (file) {
                var fig = document.createElement('figure');
                var img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                var cap = document.createElement('figcaption');
                cap.textContent = '待上传';
                fig.appendChild(img);
                fig.appendChild(cap);
                newPreviews.appendChild(fig);
            });
        }

        function showUrls() {
            urlPreviews.innerHTML = '';
            urls.value.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (u, i) {
                var fig = document.createElement('figure');
                var img = document.createElement('img');
                img.src = u;
                var cap = document.createElement('figcaption');
                cap.textContent = i === 0 ? '主图' : '第 ' + (i + 1) + ' 张';
                fig.appendChild(img);
                fig.appendChild(cap);
                urlPreviews.appendChild(fig);
            });
        }

        input.addEventListener('change', showFiles);
        urls.addEventListener('input', showUrls);
        ['dragenter', 'dragover'].forEach(function (e) {
            zone.addEventListener(e, function (ev) { ev.preventDefault(); zone.classList.add('drag'); });
        });
        ['dragleave', 'drop'].forEach(function (e) {
            zone.addEventListener(e, function (ev) { ev.preventDefault(); zone.classList.remove('drag'); });
        });
        zone.addEventListener('drop', function (ev) {
            if (ev.dataTransfer && ev.dataTransfer.files.length) {
                input.files = ev.dataTransfer.files;
                showFiles();
            }
        });
        showUrls();
    })();
</script>
</body>
</html>
