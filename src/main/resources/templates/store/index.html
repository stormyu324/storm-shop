<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${en} ? 'en' : 'zh-CN'">
<head th:replace="~{fragments/layout :: head(#{store.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: storeHeader}"></header>
<main class="container">
    <section class="hero" th:if="${q == null and category == null and products.number == 0}">
        <span class="eyebrow" th:text="#{hero.eyebrow}">NEW ARRIVALS</span>
        <h1><span th:text="#{hero.title1}">发现好物，</span><span class="accent" th:text="#{hero.title2}">智选生活</span></h1>
        <p th:text="#{hero.subtitle}">精选品质好物</p>
        <div class="chips">
            <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6l-8-3z"/><path d="m9 12 2 2 4-4"/></svg><span th:text="#{hero.chip1}">正品保障</span></span>
            <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg><span th:text="#{hero.chip2}">极速发货</span></span>
            <span class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span th:text="#{hero.chip3}">无忧售后</span></span>
        </div>
        <a class="hero-action" href="#collection" th:text="${en} ? 'Explore the collection' : '探索精选好物'">探索精选好物</a>
        <div class="hero-display" aria-hidden="true">
            <div class="hero-tile main-tile"><img th:src="@{/img/demo/tee-white.svg}" alt=""></div>
            <div class="hero-tile small-tile"><img th:src="@{/img/demo/earbuds.svg}" alt=""></div>
        </div>
    </section>
    <nav class="department-nav" th:if="${q == null and category == null and products.number == 0 and !categories.empty}"
         th:aria-label="#{store.categories}">
        <a class="department-link" th:each="c : ${categories}" th:href="@{/(category=${c.id})}">
            <span class="department-mark" aria-hidden="true"></span>
            <span th:text="${c.title(en)}">商品分类</span>
            <span class="department-chevron" aria-hidden="true"></span>
        </a>
    </nav>
    <section class="ai-shop card" th:if="${aiShopping and q == null and category == null and products.number == 0}"
             th:attr="data-ai-thinking=#{ai.thinking},data-ai-error=#{ai.error},data-ai-empty=#{ai.empty},data-ai-from=#{ai.from}">
        <div class="ai-head">
            <span class="ai-badge">✨ AI</span>
            <div>
                <h2 th:text="#{ai.title}">AI 导购</h2>
                <p class="muted" th:text="#{ai.subtitle}">说说你想买什么，AI 帮你从店里挑</p>
            </div>
        </div>
        <form class="ai-form" data-ai-form>
            <input name="query" maxlength="300" required th:placeholder="#{ai.placeholder}" autocomplete="off">
            <button type="submit" th:text="#{ai.ask}">帮我挑</button>
        </form>
        <div class="ai-examples">
            <button type="button" class="chip" th:each="ex : ${#strings.arraySplit(#messages.msg('ai.examples'), '|')}"
                    th:text="${ex}" data-ai-example></button>
        </div>
        <div class="ai-result" data-ai-result hidden></div>
    </section>
    <div class="collection-heading">
        <h2 th:text="${en} ? 'Everyday essentials' : '日常好物，恰到好处'">日常好物，恰到好处</h2>
        <p th:text="${en} ? 'Apparel · Home · Electronics' : '舒适穿搭 · 质感家居 · 灵感数码'">舒适穿搭 · 质感家居 · 灵感数码</p>
    </div>
    <div class="store-layout" id="collection">
        <aside>
            <p class="side-title" th:text="#{store.categories}">Categories</p>
            <ul class="side-cats">
                <li><a th:href="@{/(q=${q})}" th:classappend="${category == null} ? 'active'" th:text="#{store.all}">全部商品</a></li>
                <li th:each="c : ${categories}">
                    <a th:href="@{/(category=${c.id},q=${q})}" th:classappend="${category == c.id} ? 'active'" th:text="${c.title(en)}">分类</a>
                </li>
            </ul>
        </aside>
        <section>
            <div class="toolbar">
                <div class="muted">
                    <span th:if="${q}" th:text="#{store.results(${q})}"></span><span th:text="#{store.count(${products.totalElements})}">共 0 件商品</span>
                </div>
                <form th:action="@{/}" method="get">
                    <input type="hidden" name="q" th:value="${q}">
                    <input type="hidden" name="category" th:value="${category}">
                    <select name="sort" onchange="this.form.submit()">
                        <option value="new" th:selected="${sort == 'new'}" th:text="#{sort.new}">最新上架</option>
                        <option value="price_asc" th:selected="${sort == 'price_asc'}" th:text="#{sort.priceAsc}">价格从低到高</option>
                        <option value="price_desc" th:selected="${sort == 'price_desc'}" th:text="#{sort.priceDesc}">价格从高到低</option>
                    </select>
                </form>
            </div>

            <div class="card center muted" th:if="${products.empty}" th:text="#{store.empty}">暂时没有商品</div>

            <div class="product-grid">
                <a class="product-card" th:each="p : ${products}" th:href="@{/products/{id}(id=${p.id})}"
                   th:with="f=${p.parentSku != null} ? ${families.get(p.parentSku)} : null">
                    <div class="thumb">
                        <span class="sale-tag" th:if="${p.hasDiscount()}" th:text="#{product.sale}">SALE</span>
                        <img th:src="${p.mainImage != null} ? ${p.mainImage} : @{/img/placeholder.svg}" th:alt="${p.title(en)}" loading="lazy">
                    </div>
                    <div class="info">
                        <div class="product-category" th:if="${p.category != null}" th:text="${p.category.title(en)}">分类</div>
                        <div class="name" th:text="${f != null and f.title(en) != null} ? ${f.title(en)} : ${p.title(en)}">商品名称</div>
                        <div th:if="${f != null and f.priceVaries}">
                            <span class="price" th:text="#{product.priceFrom(${@pricing.format(f.minPrice, currency)})}">¥0.00 起</span>
                        </div>
                        <div th:unless="${f != null and f.priceVaries}">
                            <span class="price" th:text="${@pricing.formatPrice(p, currency)}">¥0.00</span>
                            <span class="orig" th:if="${p.hasDiscount()}" th:text="${@pricing.formatOriginalPrice(p, currency)}"></span>
                        </div>
                        <span class="product-open" aria-hidden="true"></span>
                        <div class="variant-count" th:if="${f != null and f.variantCount > 1}"
                             th:text="#{product.variantCount(${f.variantCount})}">3 个规格</div>
                        <div class="soldout" th:if="${f != null} ? ${!f.inStock} : ${p.stock <= 0}" th:text="#{product.soldOut}">已售罄</div>
                    </div>
                </a>
            </div>

            <nav class="pager" th:if="${products.totalPages > 1}">
                <th:block th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}">
                    <span class="current" th:if="${i == products.number}" th:text="${i + 1}"></span>
                    <a th:unless="${i == products.number}" th:href="@{/(q=${q},category=${category},sort=${sort},page=${i})}" th:text="${i + 1}"></a>
                </th:block>
            </nav>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:if="${aiShopping}" th:src="@{/js/ai-shop.js}" defer></script>
</body>
</html>
