<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${en} ? 'en' : 'zh-CN'">
<head th:replace="~{fragments/layout :: head(#{checkout.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: storeHeader}"></header>
<main class="container narrow">
    <h1 th:text="#{checkout.title}">确认订单</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card">
        <h2 th:text="#{checkout.items}">商品清单</h2>
        <table>
            <tr th:each="line : ${cart.lines}">
                <td th:text="${line.product.title(en)}"></td>
                <td class="num" th:text="'× ' + ${line.quantity}"></td>
                <td class="num" th:text="${@pricing.format(line.subtotal, cart.currency)}"></td>
            </tr>
            <tr>
                <td colspan="2" class="num muted" th:text="#{checkout.shippingFee}">运费</td>
                <td class="num" id="shippingFee" th:text="${!cart.deliverable} ? '—' : (${cart.shipping.signum() == 0} ? #{cart.shippingFree} : ${@pricing.format(cart.shipping, cart.currency)})"></td>
            </tr>
            <tr>
                <td colspan="2" class="num"><strong th:text="#{checkout.total}">合计</strong></td>
                <td class="num price" id="grandTotal" th:text="${@pricing.format(cart.total, cart.currency)}"></td>
            </tr>
            <tr>
                <td colspan="3" class="num free-hint" id="freeHint"
                    th:text="${cart.freeRemaining != null} ? #{cart.freeShippingHint(${@pricing.format(cart.freeRemaining, cart.currency)})} : ''"></td>
            </tr>
        </table>
    </div>
    <form class="card" th:action="@{/checkout}" th:object="${form}" method="post"
          onsubmit="var b = document.getElementById('submitOrder'); if (b.dataset.sent) return false; b.dataset.sent = '1'; b.disabled = true; return true;">
        <div class="field" id="saved-addresses" hidden><label for="saved-address">会员地址 / Saved address</label><select id="saved-address"><option value="">手动填写 / Enter manually</option></select></div>
        <div class="field">
            <label for="email" th:text="${en} ? 'Email for order updates and secure lookup' : '邮箱（接收通知与查询验证码）'"></label>
            <input id="email" type="email" th:field="*{email}" maxlength="254" autocomplete="email">
            <div class="err" th:errors="*{email}"></div>
        </div>
        <h2 th:text="#{checkout.shipping}">收货信息</h2>
        <div class="grid-2">
            <div class="field">
                <label for="customerName" th:text="#{checkout.name}">收货人</label>
                <input id="customerName" th:field="*{customerName}" required maxlength="50" autocomplete="name">
                <div class="err" th:errors="*{customerName}"></div>
            </div>
            <div class="field">
                <label for="phone" th:text="#{checkout.phone}">手机号</label>
                <input id="phone" th:field="*{phone}" required maxlength="30" inputmode="tel" autocomplete="tel">
                <div class="err" th:errors="*{phone}"></div>
            </div>
        </div>
        <div class="field">
            <label for="country" th:text="#{checkout.country}">国家 / 地区</label>
            <select id="country" th:field="*{country}" required autocomplete="country">
                <option th:each="c : ${countries}" th:value="${c.code}" th:text="${c.name}"></option>
            </select>
            <div class="err" th:errors="*{country}"></div>
            <div class="alert error" id="shipNotice" th:style="${cart.deliverable} ? 'display:none' : ''"
                 th:text="${cart.deliverable} ? '' : #{error.shipping.unavailable(${T(com.javastorm.shop.service.Countries).name(cart.country, #locale)})}"></div>
        </div>
        <div class="field">
            <label for="address" th:text="#{checkout.address}">收货地址</label>
            <input id="address" th:field="*{address}" required maxlength="300" autocomplete="street-address">
            <div class="err" th:errors="*{address}"></div>
        </div>
        <div class="field">
            <label for="note" th:text="#{checkout.note}">备注（可选）</label>
            <input id="note" th:field="*{note}" maxlength="500">
        </div>
        <div class="field"><label for="couponCode">优惠码 / Coupon code</label><input id="couponCode" th:field="*{couponCode}" maxlength="40">
          <button type="button" class="ghost" id="applyCoupon">试算优惠 / Apply code</button>
          <p id="couponFeedback" role="status"></p><p id="couponDiscount" class="muted"></p>
        </div>
        <div class="field" th:if="${paymentProviders != null and #lists.size(paymentProviders) > 1}">
            <label for="paymentProvider" th:text="${en} ? 'Payment method' : '支付方式'">支付方式</label>
            <select id="paymentProvider" th:field="*{paymentProvider}">
                <option th:each="p : ${paymentProviders}" th:value="${p}"
                        th:text="${p == 'paypal' ? 'PayPal' : 'Stripe (Card / Apple Pay / Google Pay)'}"></option>
            </select>
        </div>
        <p class="muted" th:text="${onlinePayment} ? #{checkout.onlinePayment} : #{checkout.noPayment}">本店暂未接入在线支付</p>
        <button type="submit" id="submitOrder" th:disabled="${!cart.deliverable}"
                th:text="${onlinePayment} ? #{checkout.submitPay} : #{checkout.submit}">提交订单</button>
    </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script>
    (function () {
        var select = document.getElementById('country');
        if (!select) return;
        select.addEventListener('change', function () {
            fetch('/checkout/shipping?country=' + encodeURIComponent(select.value) + '&couponCode=' + encodeURIComponent(document.getElementById('couponCode').value), {headers: {'Accept': 'application/json'}})
                .then(function (res) { if (!res.ok) throw new Error('网络错误，请重试 / Network error'); return res.json(); })
                .then(function (d) {
                    document.getElementById('couponFeedback').textContent = d.couponError || '';
                    document.getElementById('couponDiscount').textContent = d.discount ? '优惠 / Discount ' + d.discount : '';
                    document.getElementById('shippingFee').textContent = d.shipping;
                    document.getElementById('grandTotal').textContent = d.total;
                    document.getElementById('freeHint').textContent = d.freeHint || '';
                    var notice = document.getElementById('shipNotice');
                    notice.textContent = d.notice || '';
                    notice.style.display = d.deliverable ? 'none' : '';
                    document.getElementById('submitOrder').disabled = !d.deliverable;
                }).catch(function (e) { document.getElementById('couponFeedback').textContent = e.message; });
        });
        document.getElementById('applyCoupon').addEventListener('click', function () { select.dispatchEvent(new Event('change')); });
    })();
</script>
<script th:src="@{/js/member-checkout.js}" defer></script>
</body>
</html>
