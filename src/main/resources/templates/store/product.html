<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${en} ? 'en' : 'zh-CN'">
<head th:replace="~{fragments/layout :: head(${product.title(en)})}"></head>
<body>
<header th:replace="~{fragments/layout :: storeHeader}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <p class="crumbs">
        <a th:href="@{/}" th:text="#{product.home}">首页</a>
        <th:block th:if="${product.category}"> / <a th:href="@{/(category=${product.category.id})}" th:text="${product.category.title(en)}"></a></th:block>
    </p>
    <div class="detail card">
        <div class="gallery">
            <div class="main">
                <img id="mainImage" th:src="${product.mainImage != null} ? ${product.mainImage} : @{/img/placeholder.svg}" th:alt="${product.title(en)}">
            </div>
            <div class="thumbs" th:if="${product.imageUrls.size() > 1}">
                <img th:each="url, st : ${product.imageUrls}" th:src="${url}" th:classappend="${st.first} ? 'active'" alt="">
            </div>
        </div>
        <div>
            <h1 th:text="${product.title(en)}">商品名称</h1>
            <p><button id="save-favorite" type="button" class="ghost" th:attr="data-product-id=${product.id}" th:text="${en} ? 'Save product' : '收藏商品'"></button><span id="favorite-feedback" role="status"></span></p>
            <div class="price-box">
                <span class="price" th:text="${@pricing.formatPrice(product, currency)}">¥0.00</span>
                <span class="orig" th:if="${product.hasDiscount()}" th:text="${@pricing.formatOriginalPrice(product, currency)}"></span>
            </div>
            <div class="variant-picker" th:unless="${variants.empty}">
                <div class="variant-row" th:unless="${variants.colors.empty}">
                    <span class="variant-label"><th:block th:text="#{product.color} + (${en} ? ': ' : '：')">颜色：</th:block><b th:text="${product.color}"></b></span>
                    <div class="variant-options">
                        <a th:each="o : ${variants.colors}" th:href="@{/products/{id}(id=${o.targetId})}" th:text="${o.label}"
                           class="variant-option" th:classappend="${(o.selected ? 'selected ' : '') + (o.available ? '' : 'unavailable')}"
                           th:attr="aria-current=${o.selected} ? 'true' : null"></a>
                    </div>
                </div>
                <div class="variant-row" th:unless="${variants.sizes.empty}">
                    <span class="variant-label"><th:block th:text="#{product.size} + (${en} ? ': ' : '：')">尺码：</th:block><b th:text="${product.size}"></b></span>
                    <div class="variant-options">
                        <a th:each="o : ${variants.sizes}" th:href="@{/products/{id}(id=${o.targetId})}" th:text="${o.label}"
                           class="variant-option" th:classappend="${(o.selected ? 'selected ' : '') + (o.available ? '' : 'unavailable')}"
                           th:attr="aria-current=${o.selected} ? 'true' : null"></a>
                    </div>
                </div>
            </div>
            <div class="spec">
                <span><th:block th:text="#{product.stock}">库存</th:block> <b th:text="${product.stock > 0} ? ${product.stock} : #{product.soldOut}"></b></span>
                <span><th:block th:text="#{product.sku}">编号</th:block> <b th:text="${product.sku}"></b></span>
                <span th:if="${product.brand}"><th:block th:text="#{product.brand}">品牌</th:block> <b th:text="${product.brand}"></b></span>
                <span th:if="${product.color != null and variants.colors.empty}"><th:block th:text="#{product.color}">颜色</th:block> <b th:text="${product.color}"></b></span>
                <span th:if="${product.size != null and variants.sizes.empty}"><th:block th:text="#{product.size}">尺码</th:block> <b th:text="${product.size}"></b></span>
                <span th:if="${product.material}"><th:block th:text="#{product.material}">材质</th:block> <b th:text="${product.material}"></b></span>
            </div>
            <form th:if="${product.stock > 0}" th:action="@{/cart/add}" method="post" class="actions">
                <input type="hidden" name="productId" th:value="${product.id}">
                <label><th:block th:text="#{product.qty}">数量</th:block> <input class="qty" type="number" name="quantity" value="1" min="1" th:max="${product.stock}"></label>
                <button type="submit" class="ghost" th:text="#{product.addToCart}">加入购物车</button>
                <button type="submit" name="buyNow" value="1" th:text="#{product.buyNow}">立即购买</button>
            </form>
            <p th:if="${product.stock <= 0}"><button disabled class="ghost" th:text="#{product.soldOut}">已售罄</button></p>
            <div class="ai-pair" th:if="${aiShopping}"
                 th:attr="data-ai-thinking=#{ai.thinking},data-ai-error=#{ai.error},data-ai-empty=#{ai.empty},data-ai-from=#{ai.from},data-product-id=${product.id}">
                <button type="button" class="ghost small" data-ai-pair th:text="#{ai.pairing}">✨ AI 推荐搭配</button>
                <div class="ai-result" data-ai-result hidden></div>
            </div>
            <hr class="divider">
            <th:block th:if="${en and !product.bulletPointList.isEmpty()}">
                <h2 th:text="#{product.highlights}">商品亮点</h2>
                <ul class="bullets">
                    <li th:each="b : ${product.bulletPointList}" th:text="${b}"></li>
                </ul>
            </th:block>
            <h2 th:text="#{product.details}">商品详情</h2>
            <div class="description" th:text="${product.description(en) ?: #messages.msg('product.noDescription')}"></div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:if="${aiShopping}" th:src="@{/js/ai-shop.js}" defer></script>
<script th:src="@{/js/product-gallery.js}" defer></script>
<script th:src="@{/js/member-checkout.js}" defer></script>
</body>
</html>
