<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${en} ? 'en' : 'zh-CN'">
<head th:replace="~{fragments/layout :: head(#{cart.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: storeHeader}"></header>
<main class="container">
    <h1 th:text="#{cart.title}">购物车</h1>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="card center" th:if="${cart.empty}">
        <p class="muted" th:text="#{cart.empty}">购物车是空的</p>
        <a th:href="@{/}" class="btn" th:text="#{cart.shopNow}">去逛逛</a>
    </div>
    <th:block th:unless="${cart.empty}">
        <div class="table-wrap card" style="padding:0">
            <table>
                <thead>
                <tr><th th:text="#{cart.col.product}">商品</th><th class="num" th:text="#{cart.col.price}">单价</th><th th:text="#{cart.col.qty}">数量</th><th class="num" th:text="#{cart.col.subtotal}">小计</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="line : ${cart.lines}">
                    <td>
                        <div class="actions">
                            <img class="mini-thumb" th:src="${line.product.mainImage != null} ? ${line.product.mainImage} : @{/img/placeholder.svg}" alt="">
                            <div>
                                <a th:href="@{/products/{id}(id=${line.product.id})}" th:text="${line.product.title(en)}"></a>
                                <div class="muted variant-note" th:if="${line.product.color != null or line.product.size != null}">
                                    <th:block th:if="${line.product.color}" th:text="#{product.color} + ': ' + ${line.product.color}"></th:block>
                                    <th:block th:if="${line.product.color != null and line.product.size != null}"> · </th:block>
                                    <th:block th:if="${line.product.size}" th:text="#{product.size} + ': ' + ${line.product.size}"></th:block>
                                </div>
                                <div class="low-stock" th:unless="${line.available}"
                                     th:text="${!line.product.onSale} ? #{cart.offShelf} : #{cart.lowStock(${line.product.stock})}"></div>
                            </div>
                        </div>
                    </td>
                    <td class="num" th:text="${@pricing.format(line.unitPrice, cart.currency)}"></td>
                    <td>
                        <form th:action="@{/cart/update}" method="post" class="actions">
                            <input type="hidden" name="productId" th:value="${line.product.id}">
                            <input class="qty" type="number" name="quantity" th:value="${line.quantity}" min="0" max="99" onchange="this.form.submit()">
                        </form>
                    </td>
                    <td class="num" th:text="${@pricing.format(line.subtotal, cart.currency)}"></td>
                    <td>
                        <form th:action="@{/cart/remove}" method="post" class="inline">
                            <input type="hidden" name="productId" th:value="${line.product.id}">
                            <button type="submit" class="link" th:text="#{cart.remove}">删除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card actions" style="justify-content:flex-end">
            <span class="muted free-hint" th:if="${cart.freeRemaining != null}"
                  th:text="#{cart.freeShippingHint(${@pricing.format(cart.freeRemaining, cart.currency)})}">再买 ¥10.00 即可包邮</span>
            <span class="muted"><th:block th:text="#{cart.shipping}">运费：</th:block><span
                    th:text="${cart.shipping.signum() == 0} ? #{cart.shippingFree} : ${@pricing.format(cart.shipping, cart.currency)}"></span></span>
            <span><th:block th:text="#{cart.total}">合计：</th:block><span class="price" th:text="${@pricing.format(cart.total, cart.currency)}"></span></span>
            <a th:if="${cart.allAvailable}" th:href="@{/checkout}" class="btn" th:text="#{cart.checkout}">去结算</a>
            <span th:unless="${cart.allAvailable}" class="muted" th:text="#{cart.fixFirst}">请先调整不可购买的商品</span>
        </div>
    </th:block>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
