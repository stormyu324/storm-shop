<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${en} ? 'en' : 'zh-CN'">
<head th:replace="~{fragments/layout :: head(#{order.success})}"></head>
<body>
<header th:replace="~{fragments/layout :: storeHeader}"></header>
<main class="container narrow">
    <div class="card center">
        <h1 th:text="#{order.success}">下单成功</h1>
        <p><th:block th:text="#{order.no}">订单号：</th:block><strong class="mono" th:text="${order.orderNo}"></strong></p>
        <p><th:block th:text="#{order.amount}">应付金额：</th:block><span class="price" th:text="${@pricing.format(order.total, order.currency)}"></span></p>
        <p class="muted"><th:block th:text="#{order.receiver}">收货人：</th:block><span th:text="${order.customerName}"></span>, <span th:text="${order.address}"></span></p>
        <a th:href="@{/}" class="btn" th:text="#{order.continue}">继续购物</a>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
