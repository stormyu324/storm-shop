<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${en} ? 'en' : 'zh-CN'">
<head th:replace="~{fragments/layout :: head(#{error.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: storeHeader}"></header>
<main class="container narrow">
    <div class="card center">
        <h1 th:text="#{error.title}">操作未完成</h1>
        <p th:text="${message}">出错了</p>
        <p class="actions" style="justify-content:center"><a href="javascript:history.back()" class="btn" th:text="#{error.back}">返回上一页</a> <a th:href="@{/}" class="btn ghost" th:text="#{error.home}">回到首页</a></p>
    </div>
</main>
</body>
</html>
