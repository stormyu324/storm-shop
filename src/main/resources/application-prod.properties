# 生产环境配置：启动时加上 SPRING_PROFILES_ACTIVE=prod
# 只覆盖与开发环境不同的项，其余沿用 application.properties

# 必须通过 ADMIN_PASSWORD 设置至少 8 位的非默认密码，否则拒绝启动
shop.admin.require-strong-password=true

# 不开放 H2 的 TCP 端口（AUTO_SERVER）；正式环境建议用 DB_URL 换成 MySQL
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/shop}
# 生产环境强制校验表结构，所有变更必须通过 Flyway 迁移脚本发布
spring.jpa.hibernate.ddl-auto=validate

# 不写入示例商品
shop.demo-data=${DEMO_DATA:false}

# 缓存模板，提高性能
spring.thymeleaf.cache=true

# 不向浏览器暴露异常细节
server.error.include-stacktrace=never
server.error.include-message=never

# 正式环境默认不公开接口文档；需要时设置 API_DOCS=true
springdoc.api-docs.enabled=${API_DOCS:false}
springdoc.swagger-ui.enabled=${API_DOCS:false}

# 会话 Cookie 只通过 HTTPS 发送（正式环境必须配置 HTTPS；临时用 HTTP 访问时可设 SESSION_COOKIE_SECURE=false）
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
# JSON 日志里不要启动横幅
spring.main.banner-mode=off
